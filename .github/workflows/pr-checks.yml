name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONPATH: python
      SPARKLAB_DISABLE_JIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check public-tree hygiene
        shell: bash
        run: |
          if git grep -I -n -E '/home/[A-Za-z0-9._-]+/' -- .; then
            echo "::error::replace machine-specific home paths with \$HOME or a documented placeholder"
            exit 1
          fi

          tracked_weights="$(git ls-files | grep -E '\.(bin|gguf|pt|pth|safetensors)$' || true)"
          if [[ -n "$tracked_weights" ]]; then
            printf '%s\n' "$tracked_weights"
            echo "::error::model weights and generated binary artifacts must not be committed"
            exit 1
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install CPU test dependencies
        shell: bash
        run: |
          uv venv --python 3.11 .venv
          mapfile -t requirements < <(python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as source:
              project = tomllib.load(source)["project"]
          print(
              *project["dependencies"],
              *project["optional-dependencies"]["dev"],
              sep="\n",
          )
          PY
          )
          uv pip install --python .venv/bin/python --torch-backend cpu "${requirements[@]}"
      - name: Run CPU tests
        run: |
          .venv/bin/python -m pytest -q \
            tests/checkpoint \
            tests/daemon \
            tests/models \
            tests/serving \
            tests/sparklab \
            tests/tokenizer \
            tests/test_*.py \
            -m "not slow and not needs_weights"
